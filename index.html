<!DOCTYPE html>
<html>
<head>
  <title>Travel Safety Tracker</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css" />

</head>
<body>

<h2>🛡️ Travel Safety Tracker</h2>

<script src="script.js"></script>

</body>
</html>
